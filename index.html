<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MasterChess Analyzer</title>

  <!-- Chessboard.js v2 (latest) -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboard-js@2.0.0-beta.6/dist/chessboard-js.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stockfish@16/src/stockfish.js"></script>
  <script src="https://unpkg.com/chess.js@1.0.0-beta.6/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboard-js@2.0.0-beta.6/dist/chessboard-js.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #board {
      width: 500px;
      margin: 20px auto;
    }
    .arrows {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .highlight-white { box-shadow: inset 0 0 0 4px rgba(255,255,0,0.8); }
    .highlight-black { box-shadow: inset 0 0 0 4px rgba(255,0,0,0.8); }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-5xl font-bold text-center mb-8 text-yellow-400">MasterChess Analyzer</h1>

    <div class="grid lg:grid-cols-2 gap-10 mb-8">
      <!-- Board -->
      <div class="flex flex-col items-center">
        <div id="board" style="width: 500px"></div>
        <div class="mt-4 text-center space-y-2">
          <div class="text-2xl font-bold">
            Eval: <span id="eval" class="text-green-400">0.0</span>
          </div>
          <button id="flip-btn" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">Flip Orientation</button>
        </div>
      </div>

      <!-- Controls -->
      <div class="space-y-6">
        <!-- API Token -->
        <div class="bg-gray-800 p-4 rounded-lg">
          <label class="block text-lg mb-2">Lichess API Token (Optional)</label>
          <input id="api-token" type="password" placeholder="lip_QZ40lrFICPlpPs7zENfr" class="w-full p-2 bg-gray-900 rounded text-sm">
          <button id="save-token" class="mt-2 bg-purple-600 px-4 py-2 rounded hover:bg-purple-700">Save Token</button>
          <p class="text-xs text-gray-400 mt-1">For puzzle loading & activity (puzzle:read scope)</p>
        </div>

        <!-- Lichess Puzzle Loader -->
        <div class="bg-gray-800 p-4 rounded-lg">
          <label class="block text-lg mb-2">Load Lichess Puzzle</label>
          <div class="flex gap-2">
            <input id="lichess-url" type="text" placeholder="https://lichess.org/training/XXXXX" class="flex-1 p-2 bg-gray-900 rounded text-sm">
            <button id="load-puzzle" class="bg-purple-600 px-4 py-2 rounded hover:bg-purple-700">Load</button>
          </div>
          <button id="load-daily" class="w-full mt-2 bg-indigo-600 px-4 py-2 rounded hover:bg-indigo-700">Load Daily Puzzle</button>
        </div>

        <!-- FEN Input -->
        <div class="bg-gray-800 p-4 rounded-lg">
          <label class="block text-lg mb-2">Current FEN</label>
          <textarea id="fen-input" class="w-full bg-gray-900 p-2 rounded text-sm h-20 font-mono"></textarea>
          <button id="set-fen" class="mt-2 bg-green-600 px-4 py-2 rounded hover:bg-green-700 w-full">Reset Board</button>
        </div>

        <!-- Moves -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-lg mb-2">Your Move</label>
            <input id="user-move-input" type="text" placeholder="e.g. c6" class="w-full p-2 bg-gray-900 rounded text-sm">
          </div>
          <div>
            <label class="block text-lg mb-2">Best Move</label>
            <input id="best-move-input" type="text" readonly class="w-full p-2 bg-green-900 rounded text-sm">
          </div>
        </div>

        <button id="analyze-btn" class="w-full bg-blue-600 px-4 py-3 rounded hover:bg-blue-700 text-lg font-bold">Analyze</button>
        <button id="deep-analysis-btn" class="w-full bg-indigo-600 px-4 py-3 rounded hover:bg-indigo-700 text-lg font-bold">Deep Analysis</button>

        <!-- Analysis Section -->
        <div id="analysis-section" class="space-y-4 hidden mt-6">
          <div id="classification" class="p-4 rounded text-white font-bold text-center text-2xl"></div>
          <div id="explanation" class="bg-gray-800 p-4 rounded"></div>

          <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-800 p-4 rounded">
              <h3 class="text-lg font-bold mb-2 text-red-400">Your Move Consequences</h3>
              <select id="your-variation-select" class="w-full p-2 bg-gray-900 rounded mb-2"></select>
              <div class="flex gap-2">
                <button id="your-prev" class="bg-blue-600 px-4 py-2 rounded">Prev</button>
                <button id="your-next" class="bg-blue-600 px-4 py-2 rounded">Next</button>
              </div>
              <p id="your-var-eval" class="mt-2 text-sm"></p>
            </div>

            <div class="bg-gray-800 p-4 rounded">
              <h3 class="text-lg font-bold mb-2 text-green-400">Best Move Lines</h3>
              <select id="best-variation-select" class="w-full p-2 bg-gray-900 rounded mb-2"></select>
              <div class="flex gap-2">
                <button id="best-prev" class="bg-blue-600 px-4 py-2 rounded">Prev</button>
                <button id="best-next" class="bg-blue-600 px-4 py-2 rounded">Next</button>
              </div>
              <p id="best-var-eval" class="mt-2 text-sm"></p>
            </div>
          </div>
        </div>

        <!-- Mistakes -->
        -->
        <div id="mistakes" class="bg-gray-800 p-4 rounded-lg mt-8">
          <h2 class="text-2xl font-bold mb-4">Session Mistakes (Last 5)</h2>
          <div id="mistakes-list" class="space-y-2 text-sm"></div>
        </div>
      </div>
    </div>

    <div id="status" class="text-center text-yellow-400 text-xl font-bold"></div>
  </div>

  <script>
    let board = null;
    let game = new Chess();
    let stockfish = null;
    let orientation = 'white';
    let bestMoveUCI = '';
    let mistakes = JSON.parse(localStorage.getItem('chessMistakes') || '[]');
    let originalFen = '';
    let originalEval = 0;
    let yourVariations = [];
    let bestVariations = [];
    let currentVarType = 'your';
    let currentVarIndex = 0;
    let currentStep = 0;
    let lastPVs = [];
    let currentFen = '';
    let currentAnalysis = '';
    let apiToken = localStorage.getItem('lichessToken') || '';

    // === BOARD INITIALIZATION (chessboard.js v2) ===
    const config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      showNotation: true
    };
    board = Chessboard('board', config);
    addArrowsOverlay();

    function addArrowsOverlay() {
      if ($('.arrows').length === 0) {
        $('#board').append(`
          <svg class="arrows">
            <defs>
              <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#4ade80" />
              </marker>
            </defs>
          </svg>
        `);
      }
    }

    function drawArrow(uci) {
      clearArrows();
      const from = uci.slice(0,2);
      const to = uci.slice(2,4);
      const $from = $(`.square-${from}`);
      const $to = $(`.square-${to}`);
      if ($from.length && $to.length) {
        const fromPos = $from.offset();
        const toPos = $to.offset();
        const boardPos = $('#board').offset();
        const x1 = fromPos.left - boardPos.left + 31.25;
        const y1 = fromPos.top - boardPos.top + 31.25;
        const x2 = toPos.left - boardPos.left + 31.25;
        const y2 = toPos.top - boardPos.top + 31.25;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', '#4ade80');
        line.setAttribute('stroke-width', '8');
        line.setAttribute('opacity', '0.7');
        line.setAttribute('marker-end', 'url(#arrowhead)');
        $('.arrows')[0].appendChild(line);
      }
    }

    function clearArrows() {
      $('.arrows').empty();
      addArrowsOverlay();
    }

    function onDragStart(source, piece, position, orientation) {
      if (game.game_over()) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
    }

    function onDrop(source, target) {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      $('#user-move-input').val(move.san);
      board.position(game.fen());
      updateStatus();
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    $('#flip-btn').click(() => {
      orientation = orientation === 'white' ? 'black' : 'white';
      board.orientation(orientation);
    });

    $('#set-fen').click(() => {
      const fen = $('#fen-input').val().trim() || 'start';
      game.load(fen);
      originalFen = fen;
      board.position(fen);
      $('#analysis-section').addClass('hidden');
      clearArrows();
      updateStatus();
    });

    // === STOCKFISH ===
    function initStockfish() {
      stockfish = new Worker('https://cdn.jsdelivr.net/npm/stockfish@16/src/stockfish.js');
      stockfish.postMessage('uci');
      stockfish.postMessage('setoption name MultiPV value 3');
      stockfish.postMessage('isready');

      stockfish.onmessage = function(event) {
        const line = event.data;
        if (line.startsWith('bestmove')) {
          $('#status').text('Local analysis ready');
        } else if (line.includes('info depth') && line.includes('multipv')) {
          const multipv = line.match(/multipv (\d+)/)?.[1];
          const cp = line.match(/score cp (-?\d+)/)?.[1];
          const pv = line.match(/pv ([a-h][1-8][a-h][1-8][qrbn]?)/g);
          if (multipv && cp && pv) {
            const eval = (parseInt(cp) / 100).toFixed(2);
            $('#eval').text(eval).toggleClass('text-green-400', eval >= 0).toggleClass('text-red-400', eval < 0);
          }
        }
      };
    }

    // === CLOUD ANALYSIS (chess-api.com) ===
    async function cloudAnalyze(fen, multipv = 3) {
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (apiToken) headers['Authorization'] = `Bearer ${apiToken}`;
        const res = await fetch('https://chess-api.com/v1', {
          method: 'POST',
          headers,
          body: JSON.stringify({ fen, multipv })
        });
        const data = await res.json();
        return data.lines.map(line => ({
          pv: line.pv.split(' ').map(uci => {
            const temp = new Chess(fen);
            return temp.move(uci, { sloppy: true })?.san || uci;
          }),
          uci: line.pv.split(' '),
          eval: line.score,
          text: line.comment || 'Strong continuation'
        }));
      } catch (e) {
        console.error(e);
        $('#status').text('Cloud failed – using local engine');
        return [];
      }
    }

    // === ANALYZE BUTTON ===
    $('#analyze-btn').click(async () => {
      $('#status').text('Analyzing locally...');
      bestVariations = await cloudAnalyze(originalFen);
      if (bestVariations.length > 0) {
        $('#best-move-input').val(bestVariations[0].pv[0]);
        drawArrow(bestVariations[0].uci[0]);
      }
    });

    // === DEEP ANALYSIS (your move vs best) ===
    $('#deep-analysis-btn').click(async () => {
      const userSan = $('#user-move-input').val().trim();
      if (!userSan) return alert('Enter your move first');

      const tempGame = new Chess(originalFen);
      const userMove = tempGame.move(userSan, { sloppy: true });
      if (!userMove) return alert('Invalid move');

      $('#status').text('Deep analysis in progress...');

      // Get best line from original position
      bestVariations = await cloudAnalyze(originalFen);
      originalEval = bestVariations[0]?.eval || 0;

      // Get lines after your move
      yourVariations = await cloudAnalyze(tempGame.fen());
      const userEval = yourVariations[0]?.eval || 0;
      const delta = originalEval - userEval;

      // Classification
      let type = delta > 3 ? 'Blunder' : delta > 1 ? 'Mistake' : delta > 0.5 ? 'Inaccuracy' : 'Good move';
      const colors = { Blunder: 'bg-red-600', Mistake: 'bg-orange-600', Inaccuracy: 'bg-yellow-600', 'Good move': 'bg-green-600' };
      $('#classification').removeClass().addClass(`${colors[type]} p-4 rounded`).text(type);

      // Explanation
      let exp = `<p><strong>${userSan}</strong> → ${type} (Δ${delta.toFixed(2)})</p><p>How opponent punishes:</p>`;
      yourVariations.forEach((v, i) => {
        exp += `<details class="mt-2"><summary>Line ${i+1}: ${v.pv.join(' ')} (eval ${v.eval})</summary>${v.text}</details>`;
      });
      $('#explanation').html(exp);

      // Populate selects
      $('#your-variation-select, #best-variation-select').empty();
      yourVariations.forEach((v, i) => $('#your-variation-select').append(`<option value="${i}">Line ${i+1}: ${v.eval}</option>`));
      bestVariations.forEach((v, i) => $('#best-variation-select').append(`<option value="${i}">Line ${i+1}: ${v.eval}</option>`));

      $('#analysis-section').removeClass('hidden');
      currentVarType = 'your';
      currentVarIndex = 0;
      currentStep = 0;
      updateVariationBoard();

      // Save mistake
      if (delta > 0.5) {
        mistakes.push({ user: userSan, best: bestVariations[0]?.pv[0] || '?', delta: delta.toFixed(2), date: new Date().toLocaleString() });
        localStorage.setItem('chessMistakes', JSON.stringify(mistakes));
        updateMistakesList();
      }
    });

    function updateVariationBoard() {
      const vars = currentVarType === 'your' ? yourVariations : bestVariations;
      const line = vars[currentVarIndex];
      if (!line) return;

      const temp = new Chess(originalFen);
      for (let i = 0; i < currentStep; i++) {
        temp.move(line.pv[i], { sloppy: true });
      }
      board.position(temp.fen());
      clearArrows();
      if (currentStep < line.uci.length) {
        drawArrow(line.uci[currentStep]);
      }

      const evalText = `Step ${currentStep + 1}/${line.pv.length} | Eval: ${line.eval} | ${line.pv.join(' ')}`;
      $(`#${currentVarType}-var-eval`).text`).text(evalText);
    }

    $('#your-variation-select, #best-variation-select').change(function () {
      currentVarType = this.id.includes('your') ? 'your' : 'best';
      currentVarIndex = parseInt(this.value);
      currentStep = 0;
      updateVariationBoard();
    });

    $('#your-prev, #best-prev').click(() => { if (currentStep > 0) currentStep--; updateVariationBoard(); });
    $('#your-next, #best-next').click(() => {
      const vars = currentVarType === 'your' ? yourVariations : bestVariations;
      if (currentStep < vars[currentVarIndex].pv.length) currentStep++;
      updateVariationBoard();
    });

    function updateMistakesList() {
      const list = $('#mistakes-list');
      list.empty();
      mistakes.slice(-5).reverse().forEach(m => {
        list.append(`<div class="text-gray-300">Played <strong>${m.user}</strong> → Best: <strong>${m.best}</strong> (Δ${m.delta}) – ${m.date}</div>`);
      });
    }

    function updateStatus() {
      let status = game.turn() === 'w' ? 'White to move' : 'Black to move';
      if (game.in_checkmate()) status = 'Checkmate!';
      else if (game.in_draw()) status = 'Draw';
      $('#status').text(status);
    }

    // === PUZZLE LOADING ===
    $('#save-token').click(() => {
      apiToken = $('#api-token').val().trim();
      localStorage.setItem('lichessToken', apiToken);
      alert(apiToken ? 'Token saved' : 'Token cleared');
    });

    $('#load-puzzle').click(async () => {
      const url = $('#lichess-url').val();
      const id = url.match(/training\/(\w+)/)?.[1];
      if (!id) return alert('Invalid URL');
      const headers = apiToken ? { Authorization: `Bearer ${apiToken}` } : {};
      const res = await fetch(`https://lichess.org/api/puzzle/${id}`, { headers);
      const data = await res.json();
      const fen = data.puzzle.fen;
      game.load(fen);
      originalFen = fen;
      board.position(fen);
      $('#fen-input').val(fen);
      bestMoveUCI = data.puzzle.solution[0];
      const bestSan = game.move(bestMoveUCI, { sloppy: true })?.san;
      game.undo();
      $('#best-move-input').val(bestSan);
      drawArrow(bestMoveUCI);
      $('#status').text(`Puzzle loaded – Themes: ${data.puzzle.themes.join(', ')}`);
    });

    $('#load-daily').click(async () => {
      const headers = apiToken ? { Authorization: `Bearer ${apiToken}` } : {};
      const res = await fetch('https://lichess.org/api/puzzle/daily', headers);
      const data = await res.json();
      const fen = data.puzzle.fen;
      game.load(fen);
      originalFen = fen;
      board.position(fen);
      $('#fen-input').val(fen);
      const bestSan = game.move(data.puzzle.solution[0], { sloppy: true })?.san;
      game.undo();
      $('#best-move-input').val(bestSan);
      drawArrow(data.puzzle.solution[0]);
      $('#status').text('Daily puzzle loaded');
    });

    // === INITIALIZE ===
    $(document).ready(() => {
      $('#api-token').val(apiToken);
      initStockfish();
      game.load('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
      originalFen = game.fen();
      $('#fen-input').val(originalFen);
      updateMistakesList();
      updateStatus();
    });
  </script>
</body>
</html>

Enjoy your MasterChess Analyzer — now better than ever!

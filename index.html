<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Move Analyzer</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/chess.js@latest/chess.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;
      const { Play, RotateCcw, Volume2, ChevronRight, AlertCircle, Download, BookOpen, Target, HelpCircle, Eye, Lightbulb } = lucide;
      
      const ChessMoveAnalyzer = () => {
        const [mode, setMode] = useState('analyze');
        const [fen, setFen] = useState('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
        const [lichessUrl, setLichessUrl] = useState('');
        const [userMove, setUserMove] = useState('');
        const [bestMove, setBestMove] = useState('');
        const [analyzing, setAnalyzing] = useState(false);
        const [analysis, setAnalysis] = useState(null);
        const [currentBoard, setCurrentBoard] = useState(null);
        const [selectedSquare, setSelectedSquare] = useState(null);
        const [highlightedSquares, setHighlightedSquares] = useState({});
        const [animatingMove, setAnimatingMove] = useState(null);
        const [showHint, setShowHint] = useState(false);
        const [quizAnswer, setQuizAnswer] = useState('');
        const [mistakes, setMistakes] = useState([]);
        const [patterns, setPatterns] = useState({});
        const [practiceMode, setPracticeMode] = useState(false);
        const [practiceStep, setPracticeStep] = useState(0);
        const [chessInstance, setChessInstance] = useState(null);
        const [arrows, setArrows] = useState([]);
        const [evaluation, setEvaluation] = useState('0.0');
        const [whatIfMode, setWhatIfMode] = useState(false);
        const [whatIfFen, setWhatIfFen] = useState('');
        const [whatIfMove, setWhatIfMove] = useState('');
      
        useEffect(() => {
          loadMistakes();
          loadPatterns();
          const chess = new Chess(fen);
          setChessInstance(chess);
          setCurrentBoard(parseFEN(fen));
        }, [fen]);
      
        const loadMistakes = async () => {
          try {
            const result = await window.storage.list('mistake:');
            if (result && result.keys) {
              const mistakeData = await Promise.all(
                result.keys.map(async key => {
                  const data = await window.storage.get(key);
                  return data ? JSON.parse(data.value) : null;
                })
              );
              setMistakes(mistakeData.filter(m => m));
            }
          } catch (error) {
            console.log('No previous mistakes found');
          }
        };
      
        const loadPatterns = async () => {
          try {
            const result = await window.storage.get('patterns');
            if (result) {
              setPatterns(JSON.parse(result.value));
            }
          } catch (error) {
            console.log('No patterns found');
          }
        };
      
        const saveMistake = async (mistakeData) => {
          try {
            const timestamp = Date.now();
            await window.storage.set(
              `mistake:${timestamp}`,
              JSON.stringify({ ...mistakeData, timestamp })
            );
            await loadMistakes();
          } catch (error) {
            console.error('Error saving mistake:', error);
          }
        };
      
        const updatePatterns = async (tacticalPattern) => {
          try {
            const newPatterns = { ...patterns };
            newPatterns[tacticalPattern] = (newPatterns[tacticalPattern] || 0) + 1;
            await window.storage.set('patterns', JSON.stringify(newPatterns));
            setPatterns(newPatterns);
          } catch (error) {
            console.error('Error updating patterns:', error);
          }
        };
      
        const parseFEN = (fenStr) => {
          const board = Array(8).fill(null).map(() => Array(8).fill(' '));
          const [position] = fenStr.split(' ');
          const rows = position.split('/');
          
          rows.forEach((row, i) => {
            let col = 0;
            for (let char of row) {
              if (isNaN(char)) {
                board[i][col] = char;
                col++;
              } else {
                col += parseInt(char);
              }
            }
          });
          
          return board;
        };
      
        const parseLichessUrl = async (url) => {
          if (!url.trim()) {
            alert('Please enter a Lichess puzzle URL');
            return;
          }
          
          try {
            const puzzleId = url.match(/lichess\.org\/training\/(\w+)/)?.[1];
            if (!puzzleId) {
              alert('Invalid Lichess puzzle URL. Format should be: https://lichess.org/training/xxxxx');
              return;
            }
            
            alert('Note: Due to browser security restrictions, automatic Lichess puzzle loading may not work. If this fails, please:\n\n1. Open the puzzle on Lichess\n2. Click the analysis board button\n3. Copy the FEN from there\n4. Paste it in the FEN field below');
            
            const response = await fetch(`https://lichess.org/api/puzzle/${puzzleId}`, {
              method: 'GET',
              headers: {
                'Accept': 'application/json'
              }
            });
            
            if (!response.ok) {
              throw new Error('Failed to fetch puzzle');
            }
            
            const data = await response.json();
            
            if (data.puzzle && data.puzzle.fen) {
              setFen(data.puzzle.fen);
              const chess = new Chess(data.puzzle.fen);
              const solution = data.puzzle.solution;
              if (solution && solution.length > 0) {
                const uci = solution[0];
                const move = chess.move({ from: uci.slice(0,2), to: uci.slice(2,4), promotion: uci[4] });
                setBestMove(move.san);
              }
              alert('Puzzle loaded successfully!');
            } else {
              throw new Error('Invalid puzzle data');
            }
          } catch (error) {
            console.error('Error fetching Lichess puzzle:', error);
            alert('Could not automatically load the puzzle due to browser restrictions.\n\nPlease manually:\n1. Open the puzzle on Lichess\n2. Copy the FEN position\n3. Paste it in the "Or paste FEN" field below\n4. Enter the moves manually');
          }
        };
      
        const pieceSymbols = {
          'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
          'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };
      
        const squareToCoords = (square) => {
          const col = square.charCodeAt(0) - 97;
          const row = 8 - parseInt(square[1]);
          return [row, col];
        };
      
        const coordsToSquare = (row, col) => {
          return String.fromCharCode(97 + col) + (8 - row);
        };
      
        const parseMove = (notation) => {
          const match = notation.match(/([KQRBN])?([a-h])?([1-8])?(x)?([a-h][1-8])(=[QRBN])?/);
          if (match) {
            const [, piece, fromFile, fromRank, capture, toSquare, promotion] = match;
            return {
              piece: piece || 'P',
              toSquare,
              fromFile,
              fromRank,
              capture: !!capture,
              promotion: promotion?.slice(1)
            };
          }
          return null;
        };
      
        const getMaterialCount = (board) => {
          const values = { p: 1, n: 3, b: 3, r: 5, q: 9 };
          let white = 0, black = 0;
          
          board.forEach(row => {
            row.forEach(piece => {
              if (piece !== ' ') {
                const val = values[piece.toLowerCase()] || 0;
                if (piece === piece.toUpperCase()) white += val;
                else black += val;
              }
            }
          });
          
          return { white, black, advantage: white - black };
        };
      
        const analyzeMove = async () => {
          if (!userMove || !bestMove) {
            alert('Please enter both your move and the best move');
            return;
          }
      
          setAnalyzing(true);
          
          try {
            // Extract whose turn it is from FEN
            const fenParts = fen.split(' ');
            const toMove = fenParts[1] || 'w'; // 'w' for white, 'b' for black
            const turnText = toMove === 'w' ? 'White' : 'Black';
            
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [{
                  role: 'user',
                  content: `You are a chess coach analyzing moves. Provide ONLY valid JSON, no markdown.

Position (FEN): ${fen}
Turn to move: ${turnText}
Student's move: ${userMove}
Best move: ${bestMove}

IMPORTANT: The position shows ${turnText} to move. Analyze the moves accordingly.

Respond with this exact JSON structure:
{
  "moveClassification": "blunder|mistake|inaccuracy|good|excellent",
  "isEquallyGood": false,
  "explanation": "Brief explanation",
  "userMoveConsequence": "What happens after student's move",
  "bestMoveReason": "Why best move is superior",
  "opponentBestResponse": "Best response to student's move with explanation",
  "keyDifference": "Main difference between moves",
  "userContinuation": "3-4 moves after user move",
  "bestContinuation": "3-4 moves after best move",
  "alternativeMoves": ["move1", "move2"],
  "alternativeExplanations": ["why move1 is good", "why move2 is good"],
  "tacticalPattern": "fork|pin|skewer|discovery|double_attack|mate_threat|positional|other",
  "difficulty": "beginner|intermediate|advanced|expert",
  "advice": "Concrete advice",
  "hint": "Subtle hint without giving away the answer",
  "arrows": [{"from": "e2", "to": "e4", "color": "red", "explanation": "attack"}],
  "evaluation": "+0.5"
}`
                }]
              })
            });
      
            const data = await response.json();
            const text = data.content.find(c => c.type === 'text')?.text || '';
            const cleanText = text.replace(/```json\n?|\n?```/g, '').trim();
            const parsed = JSON.parse(cleanText);
            
            setAnalysis(parsed);
            setArrows(parsed.arrows || []);
            setEvaluation(parsed.evaluation);
            setCurrentBoard(parseFEN(fen));
            
            const userParsed = parseMove(userMove);
            const bestParsed = parseMove(bestMove);
            
            const highlights = {};
            if (userParsed) {
              const [row, col] = squareToCoords(userParsed.toSquare);
              highlights[`${row}-${col}`] = 'user';
            }
            if (bestParsed) {
              const [row, col] = squareToCoords(bestParsed.toSquare);
              highlights[`${row}-${col}`] = 'best';
            }
            setHighlightedSquares(highlights);
            
            if (!['good', 'excellent'].includes(parsed.moveClassification)) {
              await saveMistake({
                fen,
                userMove,
                bestMove,
                classification: parsed.moveClassification,
                pattern: parsed.tacticalPattern,
                difficulty: parsed.difficulty
              });
              await updatePatterns(parsed.tacticalPattern);
            }
            
          } catch (error) {
            console.error('Analysis error:', error);
            alert('Error analyzing move. Please check your input.');
          } finally {
            setAnalyzing(false);
          }
        };
      
        const animateMove = (fromSquare, toSquare) => {
          setAnimatingMove({ from: fromSquare, to: toSquare });
          setTimeout(() => setAnimatingMove(null), 500);
        };
      
        const handleSquareClick = (row, col) => {
          if (!chessInstance) return;
          const board = currentBoard || parseFEN(fen);
          const piece = board[row][col];
          
          if (selectedSquare) {
            const [fromRow, fromCol] = selectedSquare;
            const fromSquare = coordsToSquare(fromRow, fromCol);
            const toSquare = coordsToSquare(row, col);
            const move = chessInstance.move({ from: fromSquare, to: toSquare });
            if (move) {
              const newBoard = board.map(r => [...r]);
              newBoard[fromRow][fromCol] = ' ';
              newBoard[row][col] = piece;
              setCurrentBoard(newBoard);
              animateMove(fromSquare, toSquare);
              setUserMove(move.san);
              setFen(chessInstance.fen());
            }
            setSelectedSquare(null);
          } else if (piece !== ' ') {
            setSelectedSquare([row, col]);
          }
        };
      
        const exportToPGN = () => {
          if (!analysis) return;
          
          const pgn = `[Event "Analysis"]
[Site "Chess Analyzer"]
[Date "${new Date().toISOString().split('T')[0]}"]
[White "Student"]
[Black "Opponent"]
[Result "*"]
[FEN "${fen}"]

{Your move: ${userMove} - ${analysis.moveClassification}}
1. ${userMove} {${analysis.userMoveConsequence}} ${analysis.userContinuation}

{Best move: ${bestMove}}
1. ${bestMove} {${analysis.bestMoveReason}} ${analysis.bestContinuation}

{Key Difference: ${analysis.keyDifference}}
{Advice: ${analysis.advice}}
*`;
      
          const blob = new Blob([pgn], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `analysis-${Date.now()}.pgn`;
          a.click();
        };
      
        const speak = (text) => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
          }
        };
      
        const startQuizMode = () => {
          setMode('quiz');
          setShowHint(false);
          setQuizAnswer('');
        };
      
        const checkQuizAnswer = async () => {
          setAnalyzing(true);
          try {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [{
                  role: 'user',
                  content: `Position FEN: ${fen}
Best move: ${bestMove}
Student's threat identification: "${quizAnswer}"

Evaluate if the student correctly identified the main threat/tactic. Respond ONLY with valid JSON:
{
  "correct": true/false,
  "feedback": "explanation of the threat and whether student got it right"
}`
                }]
              })
            });
      
            const data = await response.json();
            const text = data.content.find(c => c.type === 'text')?.text || '';
            const cleanText = text.replace(/```json\n?|\n?```/g, '').trim();
            const result = JSON.parse(cleanText);
            
            alert(result.feedback);
            if (result.correct) {
              setMode('analyze');
            }
          } catch (error) {
            console.error('Quiz check error:', error);
          } finally {
            setAnalyzing(false);
          }
        };
      
        const getMoveClassColor = (classification) => {
          const colors = {
            'blunder': 'bg-red-100 text-red-800 border-red-300',
            'mistake': 'bg-orange-100 text-orange-800 border-orange-300',
            'inaccuracy': 'bg-yellow-100 text-yellow-800 border-yellow-300',
            'good': 'bg-green-100 text-green-800 border-green-300',
            'excellent': 'bg-blue-100 text-blue-800 border-blue-300'
          };
          return colors[classification] || 'bg-gray-100 text-gray-800 border-gray-300';
        };
      
        const renderSquare = (piece, row, col) => {
          const isLight = (row + col) % 2 === 0;
          const squareKey = `${row}-${col}`;
          const isSelected = selectedSquare && selectedSquare[0] === row && selectedSquare[1] === col;
          const highlight = highlightedSquares[squareKey];
          
          let bgColor = isLight ? 'bg-amber-100' : 'bg-amber-700';
          if (isSelected) bgColor = 'bg-yellow-300';
          else if (highlight === 'user') bgColor = 'bg-red-300';
          else if (highlight === 'best') bgColor = 'bg-green-300';
          
          return React.createElement('div', {
              key: squareKey,
              onClick: () => handleSquareClick(row, col),
              className: `w-14 h-14 flex items-center justify-center text-3xl cursor-pointer hover:opacity-80 transition-all ${bgColor} ${
                animatingMove && animatingMove.to === coordsToSquare(row, col) ? 'animate-pulse' : ''
              }`
            },
            piece !== ' ' && pieceSymbols[piece]
          );
        };
      
        const renderArrows = () => {
          return React.createElement('svg', {
            className: 'absolute top-0 left-0 w-full h-full pointer-events-none',
            viewBox: '0 0 448 448'
          }, arrows.map((arrow, idx) => {
            const [fromRow, fromCol] = squareToCoords(arrow.from);
            const [toRow, toCol] = squareToCoords(arrow.to);
            const x1 = fromCol * 56 + 28;
            const y1 = fromRow * 56 + 28;
            const x2 = toCol * 56 + 28;
            const y2 = toRow * 56 + 28;
            return React.createElement('line', {
              key: idx,
              x1, y1, x2, y2,
              stroke: arrow.color || 'red',
              strokeWidth: 4,
              markerEnd: 'url(#arrowhead)'
            });
          }), React.createElement('defs', null,
            React.createElement('marker', { id: 'arrowhead', markerWidth: 10, markerHeight: 7, refX: 0, refY: 3.5, orient: 'auto' },
              React.createElement('polygon', { points: '0 0, 10 3.5, 0 7', fill: 'red' })
            )
          ));
        };
      
        const startPractice = () => {
          setPracticeMode(true);
          setPracticeStep(0);
          const chess = new Chess(fen);
          setChessInstance(chess);
        };
      
        const stepPractice = () => {
          if (!analysis || !chessInstance) return;
          const moves = analysis.bestContinuation.split(' ').filter(m => m.match(/[a-h][1-8]/));
          if (practiceStep < moves.length) {
            const move = chessInstance.move(moves[practiceStep]);
            if (move) {
              setFen(chessInstance.fen());
              setPracticeStep(practiceStep + 1);
            }
          }
        };
      
        const startWhatIf = () => {
          setWhatIfMode(true);
          setWhatIfFen(fen);
          const chess = new Chess(fen);
          setChessInstance(chess);
        };
      
        const applyWhatIfMove = () => {
          if (chessInstance && whatIfMove) {
            const move = chessInstance.move(whatIfMove);
            if (move) {
              setWhatIfFen(chessInstance.fen());
            }
          }
        };
      
        const board = currentBoard || parseFEN(fen);
        const material = getMaterialCount(board);
      
        return React.createElement('div', { className: "max-w-7xl mx-auto p-4 bg-gray-50 min-h-screen" },
          React.createElement('div', { className: "bg-white rounded-lg shadow-lg p-6" },
            React.createElement('div', { className: "flex justify-between items-center mb-4" },
              React.createElement('div', null,
                React.createElement('h1', { className: "text-3xl font-bold text-gray-800" }, 'Advanced Chess Analyzer'),
                React.createElement('p', { className: "text-gray-600" }, 'Complete learning system with AI analysis')
              ),
              React.createElement('div', { className: "flex gap-2" },
                React.createElement('button', {
                  onClick: () => setMode('analyze'),
                  className: `px-4 py-2 rounded ${mode === 'analyze' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`
                }, 'Analyze'),
                React.createElement('button', {
                  onClick: startQuizMode,
                  className: `px-4 py-2 rounded ${mode === 'quiz' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`
                }, 'Quiz'),
                React.createElement('button', {
                  onClick: () => setMode('history'),
                  className: `px-4 py-2 rounded ${mode === 'history' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`
                }, 'History')
              )
            ),
            
            mode === 'analyze' && React.createElement('div', { className: "grid md:grid-cols-2 gap-6" },
              React.createElement('div', { className: "space-y-4" },
                React.createElement('div', null,
                  React.createElement('label', { className: "block text-sm font-medium mb-2" }, 'Lichess Puzzle URL (optional):'),
                  React.createElement('div', { className: "flex gap-2" },
                    React.createElement('input', {
                      type: "text",
                      value: lichessUrl,
                      onChange: (e) => setLichessUrl(e.target.value),
                      className: "flex-1 border rounded px-3 py-2 text-sm",
                      placeholder: "https://lichess.org/training/..."
                    }),
                    React.createElement('button', {
                      onClick: () => parseLichessUrl(lichessUrl),
                      className: "bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700"
                    }, 'Load')
                  )
                ),
                React.createElement('div', null,
                  React.createElement('label', { className: "block text-sm font-medium mb-2" }, 'Or paste FEN:'),
                  React.createElement('textarea', {
                    value: fen,
                    onChange: (e) => setFen(e.target.value),
                    className: "w-full border rounded px-3 py-2 font-mono text-xs h-16"
                  })
                ),
                React.createElement('div', null,
                  React.createElement('label', { className: "block text-sm font-medium mb-2" }, 'Your Move:'),
                  React.createElement('input', {
                    type: "text",
                    value: userMove,
                    onChange: (e) => setUserMove(e.target.value),
                    className: "w-full border rounded px-3 py-2",
                    placeholder: "e.g., Nf3"
                  })
                ),
                React.createElement('div', null,
                  React.createElement('label', { className: "block text-sm font-medium mb-2" }, 'Best Move:'),
                  React.createElement('input', {
                    type: "text",
                    value: bestMove,
                    onChange: (e) => setBestMove(e.target.value),
                    className: "w-full border rounded px-3 py-2",
                    placeholder: "e.g., Qh5"
                  })
                ),
                React.createElement('button', {
                  onClick: analyzeMove,
                  disabled: analyzing,
                  className: "w-full bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700 disabled:bg-gray-400"
                }, analyzing ? 'Analyzing...' : 'Deep Analysis')
              ),
              React.createElement('div', { className: "flex flex-col items-center relative" },
                React.createElement('div', { className: "mb-3 bg-gray-100 rounded p-2 w-full max-w-md" },
                  React.createElement('div', { className: "flex justify-between text-sm font-medium mb-1" },
                    React.createElement('span', null, `White: ${material.white}`),
                    React.createElement('span', { className: material.advantage > 0 ? 'text-green-600' : material.advantage < 0 ? 'text-red-600' : 'text-gray-600' },
                      (material.advantage > 0 ? '+' : '') + material.advantage
                    ),
                    React.createElement('span', null, `Black: ${material.black}`)
                  ),
                  React.createElement('div', { className: "text-center text-xs font-bold" },
                    React.createElement('span', { className: fen.split(' ')[1] === 'w' ? 'text-gray-800' : 'text-gray-400' }, 
                      fen.split(' ')[1] === 'w' ? '▶ White to move' : 'Black to move ◀'
                    ),
                    React.createElement('span', { className: "ml-2" }, `Eval: ${evaluation}`)
                  )
                ),
                React.createElement('div', { className: "border-4 border-gray-800 inline-block relative" },
                  board.map((row, rowIdx) =>
                    React.createElement('div', { key: rowIdx, className: "flex" },
                      row.map((piece, colIdx) => renderSquare(piece, rowIdx, colIdx))
                    )
                  ),
                  renderArrows()
                ),
                React.createElement('p', { className: "text-xs text-gray-500 mt-2" }, 'Click pieces to make moves')
              )
            ),
            
            analysis && mode === 'analyze' && React.createElement('div', { className: "mt-6 space-y-4" },
              React.createElement('div', { className: `border-2 rounded-lg p-4 ${getMoveClassColor(analysis.moveClassification)}` },
                React.createElement('h2', { className: "text-xl font-bold capitalize mb-2" }, analysis.moveClassification),
                React.createElement('p', null, analysis.explanation),
                analysis.isEquallyGood && React.createElement('p', { className: "text-green-600" }, 'Your move is equally good!')
              ),
              React.createElement('div', { className: "grid md:grid-cols-2 gap-4" },
                React.createElement('div', { className: "bg-red-50 border-2 border-red-200 rounded-lg p-4" },
                  React.createElement('h3', { className: "text-lg font-bold text-red-900 mb-2" }, `❌ Your Move: ${userMove}`),
                  React.createElement('p', { className: "text-gray-700 mb-2" }, analysis.userMoveConsequence),

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockfish Chess Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/stockfish@16/src/stockfish.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/chess.js@1.0.0-beta.6/chess.min.js"></script>
  <style>
    .square { width: 70px; height: 70px; }
    .light { background-color: #f0d9b5; }
    .dark { background-color: #b58863; }
    .highlight-from { box-shadow: inset 0 0 0 5px rgba(255,255,0,0.8); }
    .highlight-to { box-shadow: inset 0 0 0 5px rgba(0,255,0,0.8); }
    .arrow { stroke: #48bb78; stroke-width: 10; marker-end: url(#arrowhead); }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ChessAnalyzer = () => {
      const [fen, setFen] = useState("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
      const [mode, setMode] = useState("analyze"); // analyze, quiz, practice
      const [userMove, setUserMove] = useState("");
      const [bestMove, setBestMove] = useState("");
      const [evaluation, setEvaluation] = useState("0.0");
      const [bestLine, setBestLine] = useState("");
      const [arrows, setArrows] = useState([]);
      const [selectedSquare, setSelectedSquare] = useState(null);
      const [mistakes, setMistakes] = useState([]);
      const [patterns, setPatterns] = useState({});
      const [thinking, setThinking] = useState(false);
      const [quizActive, setQuizActive] = useState(false);
      const chessRef = useRef(new Chess());
      const stockfishRef = useRef(null);

      // Load Stockfish
      useEffect(() => {
        const sf = new Worker("https://cdn.jsdelivr.net/npm/stockfish@16/src/stockfish.js");
        sf.postMessage("uci");
        sf.postMessage("isready");
        stockfishRef.current = sf;

        // Load saved data
        const savedMistakes = localStorage.getItem("chessMistakes");
        if (savedMistakes) setMistakes(JSON.parse(savedMistakes));
        const savedPatterns = localStorage.getItem("chessPatterns");
        if (savedPatterns) setPatterns(JSON.parse(savedPatterns));

        return () => sf.terminate();
      }, []);

      const chess = chessRef.current;
      chess.load(fen);

      const getBoard = () => {
        const board = Array(8).fill(null).map(() => Array(8).fill(null));
        const rows = fen.split(" ")[0].split("/");
        let r = 0, c = 0;
        for (let row of rows) {
          for (let ch of row) {
            if (isNaN(ch)) board[r][c++] = ch;
            else c += parseInt(ch);
          }
          r++; c = 0;
        }
        return board;
      };

      const squareName = (r, c) => String.fromCharCode(97 + c) + (8 - r);
      const nameToCoord = (name) => ({ r: 8 - parseInt(name[1]), c: name.charCodeAt(0) - 97 });

      const pieceSymbol = {
        'K': '♔','Q': '♕','R': '♖','B': '♗','N': '♘','P': '♙',
        'k': '♚','q': '♛','r': '♜','b': '♝','n': '♞','p': '♟'
      };

      const analyzePosition = () => {
        if (!stockfishRef.current) return;
        setThinking(true);
        setArrows([]);

        const sf = stockfishRef.current;
        sf.onmessage = (event) => {
          const line = event.data;
          if (line.startsWith("info depth")) {
            const match = line.match(/score cp (-?\d+).*pv\s+(\S+)/);
            if (match) {
              const score = (parseInt(match[1]) / 100).toFixed(1);
              setEvaluation(chess.turn() === 'w' ? score : (-score).toFixed(1));
              const pvMove = match[2];
              const from = pvMove.slice(0,2), to = pvMove.slice(2,4);
              setArrows([{ from, to }]);
              setBestMove(chess.move({ from, to, promotion: pvMove[4] || 'q' })?.san || "");
            }
          }
          if (line.includes("bestmove")) {
            const best = line.match(/bestmove\s+(\S+)/);
            if (best) {
              const move = best[1];
              const from = move.slice(0,2), to = move.slice(2,4);
              const san = chess.move({ from, to, promotion: move[4] || 'q' })?.san;
              setBestMove(san || "");
              setArrows([{ from, to }]);
              setThinking(false);
            }
          }
        };

        sf.postMessage("position fen " + fen);
        sf.postMessage("go depth 20");
      };

      const handleSquareClick = (r, c) => {
        const sq = squareName(r, c);
        if (selectedSquare) {
          const from = selectedSquare;
          try {
            const move = chess.move({ from, to: sq, promotion: 'q' });
            if (move) {
              setFen(chess.fen());
              setUserMove(move.san);
              setSelectedSquare(null);
              if (mode === "quiz") checkQuizAnswer(move.san);
            }
          else setSelectedSquare(null);
          } catch (e) {
            setSelectedSquare(null);
          }
        } else if (chess.get(sq)) {
          setSelectedSquare(sq);
        }
      };

      const startQuiz = () => {
        setMode("quiz");
        setQuizActive(true);
        setUserMove("");
        setBestMove("");
        setArrows([]);
        analyzePosition();
      };

      const checkQuizAnswer = (move) => {
        if (move === bestMove) {
          alert("Correct! Great job!");
          setQuizActive(false);
        } else {
          const mistake = { fen, userMove: move, bestMove, date: new Date().toLocaleString() };
          const updated = [...mistakes, mistake];
          setMistakes(updated);
          localStorage.setItem("chessMistakes", JSON.stringify(updated));
          alert(`Wrong. Best was ${bestMove}`);
        }
      };

      const exportPGN = () => {
        const pgn = `[Event "Stockfish Analysis"]
[FEN "${fen}"]

1. ${userMove || "?"} ${bestMove ? "{" + bestMove + " " + evaluation + "}" : ""}`;
        const blob = new Blob([pgn], {type: "text/plain"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "analysis.pgn"; a.click();
      };

      const board = getBoard();

      return (
        <div className="max-w-6xl mx-auto p-6">
          <h1 className="text-5xl font-bold text-center mb-8 text-yellow-400">Stockfish Chess Analyzer</h1>

          <div className="grid lg:grid-cols-2 gap-10">
            {/* Board */}
            <div className="flex flex-col items-center">
              <div className="relative inline-block border-4 border-yellow-600 rounded">
                <div className="grid grid-cols-8">
                  {board.map((row, r) => row.map((piece, c) => {
                    const sq = squareName(r, c);
                    const isLight = (r + c) % 2 === 0;
                    const isSelected = selectedSquare === sq;
                    const arrowTo = arrows.find(a => a.to === sq);
                    return (
                      <div
                        key={sq}
                        onClick={() => handleSquareClick(r, c)}
                        className={`square flex items-center justify-center text-6xl cursor-pointer transition-all
                          ${isLight ? 'light' : 'dark'}
                          ${isSelected ? 'highlight-from' : ''}
                          ${arrowTo ? 'highlight-to' : ''}`}
                      >
                        {piece && pieceSymbol[piece]}
                      </div>
                    );
                  }))}
                </div>

                {/* Arrows */}
                <svg className="absolute inset-0 w-full h-full pointer-events-none">
                  <defs>
                    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
                      <path d="M0,0 V12 L18,6 Z" fill="#48bb78"/>
                    </marker>
                  </defs>
                  {arrows.map((a, i) => {
                    const f = nameToCoord(a.from);
                    const t = nameToCoord(a.to);
                    return (
                      <line
                        key={i}
                        x1={f.c * 70 + 35} y1={f.r * 70 + 35}
                        x2={t.c * 70 + 35} y2={t.r * 70 + 35}
                        className="arrow"
                      />
                    );
                  })}
                </svg>
              </div>

              <div className="mt-6 text-3xl font-bold text-yellow-300">
                Evaluation: <span className={evaluation > 0 ? "text-green-400" : "text-red-400"}>{evaluation}</span>
                {thinking && " (thinking...)"}
              </div>
              {bestMove && <div className="mt-4 text-xl">Best move: <strong>{bestMove}</strong></div>}
            </div>

            {/* Controls */}
            <div className="space-y-6">
              <div className="bg-gray-800 p-6 rounded-lg">
                <label className="block text-lg mb-2">FEN Position</label>
                <textarea
                  className="w-full bg-gray-900 p-3 rounded text-sm font-mono h-32"
                  value={fen}
                  onChange={e => setFen(e.target.value)}
                />
              </div>

              <div className="grid grid-cols-2 gap-4">
                <button
                  onClick={analyzePosition}
                  disabled={thinking}
                  className="bg-blue-600 hover:bg-blue-700 py-4 rounded text-xl font-bold disabled:opacity-50"
                >
                  {thinking ? "Analyzing..." : "Analyze Position"}
                </button>
                <button
                  onClick={startQuiz}
                  className="bg-purple-600 hover:bg-purple-700 py-4 rounded text-xl font-bold"
                >
                  Quiz Mode
                </button>
              </div>

              {userMove && (
                <div className="bg-green-900 p-4 rounded">
                  <strong>Your move:</strong> {userMove}
                </div>
              )}

              <button
                onClick={exportPGN}
                className="w-full bg-gray-700 hover:bg-gray-600 py-3 rounded"
              >
                Export as PGN
              </button>

              {/* Mistakes & Patterns */}
              <div className="bg-gray-800 p-6 rounded-lg mt-8">
                <h2 className="text-2xl font-bold mb-4">Your Mistakes</h2>
                {mistakes.slice(-5).reverse().map((m,i) => (
                  <div key={i} className="text-sm mb-2">{m.userMove} → {m.bestMove}</div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ChessAnalyzer />);
  </script>
</body>
</html>

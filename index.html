<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Chess Trainer</title>

<link rel="stylesheet" href="https://unpkg.com/chessboardjs@1.0.0/www/css/chessboard.css">

<script src="https://unpkg.com/chess.js@1.0.0/chess.js"></script>
<script src="https://unpkg.com/chessboardjs@1.0.0/www/js/chessboard.js"></script>

<style>
body {
  background:#0f0f0f;
  color:#eaeaea;
  font-family: Arial, sans-serif;
  display:flex;
  gap:20px;
  padding:20px;
}
#board { width:480px; }
#panel { width:440px; }

button {
  background:#1976d2;
  border:none;
  color:white;
  padding:8px 12px;
  margin:4px 0;
  cursor:pointer;
}
button:hover { background:#125ea8; }

#explanation {
  background:#1b1b1b;
  padding:10px;
  min-height:140px;
  border-left:4px solid #1976d2;
}

.square-highlight {
  box-shadow: inset 0 0 0 4px rgba(255,0,0,0.7);
}

.heat-low { background: rgba(255,0,0,0.15) !important; }
.heat-mid { background: rgba(255,0,0,0.3) !important; }
.heat-high { background: rgba(255,0,0,0.5) !important; }
</style>
</head>

<body>

<div id="board"></div>

<div id="panel">
  <h2>Advanced Chess Trainer</h2>
  <button onclick="newGame()">New Game</button>
  <button onclick="explain()">Explain Last Move</button>
  <button onclick="showBest()">Show Best Move</button>
  <button onclick="toggleHeatmap()">Toggle Heatmap</button>

  <div id="explanation">Play your opening.</div>
</div>

<script>
const game = new Chess();
let heatmap = {};
let heatmapEnabled = false;

// OPENING REPERTOIRE (EDIT THESE)
const whiteOpening = ["e4", "Nf3", "Bc4"];
const blackDefense = ["e5", "Nc6", "Nf6"];

const board = Chessboard("board", {
  draggable:true,
  position:"start",
  onDrop:onDrop
});

// STOCKFISH
const engine = new Worker("https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish.js");
engine.postMessage("uci");

function newGame() {
  game.reset();
  board.position("start");
  setText("New game started. Stick to your opening.");
}

function onDrop(from, to) {
  const move = game.move({from, to, promotion:'q'});
  if (!move) return "snapback";

  board.position(game.fen());
  checkOpening(move);
  evaluate();
}

function checkOpening(move) {
  const ply = game.history().length - 1;
  const expected = game.turn() === 'b' ? whiteOpening : blackDefense;
  if (ply < expected.length && move.san !== expected[ply]) {
    markMistake(move.to);
    setText(`
<b>Opening Deviation</b><br>
Expected: ${expected[ply]}<br>
Played: ${move.san}<br><br>
This breaks your planned structure and tempo.
`);
  }
}

function evaluate() {
  engine.postMessage("position fen " + game.fen());
  engine.postMessage("go depth 12");
}

engine.onmessage = e => {
  if (e.data.includes("bestmove")) {
    const best = e.data.split(" ")[1];
    drawArrow(best);
  }
};

function explain() {
  const h = game.history({verbose:true});
  if (!h.length) return;

  const last = h[h.length-1];
  setText(`
<b>${last.san}</b><br><br>
Consider:
• Did this improve piece activity?<br>
• Did it weaken squares?<br>
• Did it allow tempo?<br><br>
Strong moves increase pressure or reduce opponent options.
`);
}

function showBest() {
  setText("Green arrow shows engine-recommended move.");
}

function drawArrow(move) {
  clearHighlights();
  if (!move || move.length < 4) return;
  const to = move.substring(2,4);
  highlight(to);
}

function highlight(square) {
  const el = document.querySelector(".square-" + square);
  if (el) el.classList.add("square-highlight");
}

function clearHighlights() {
  document.querySelectorAll(".square-highlight")
    .forEach(e=>e.classList.remove("square-highlight"));
}

function markMistake(square) {
  heatmap[square] = (heatmap[square] || 0) + 1;
  applyHeatmap();
}

function applyHeatmap() {
  if (!heatmapEnabled) return;
  for (const sq in heatmap) {
    const el = document.querySelector(".square-" + sq);
    if (!el) continue;
    el.classList.remove("heat-low","heat-mid","heat-high");
    if (heatmap[sq] > 5) el.classList.add("heat-high");
    else if (heatmap[sq] > 2) el.classList.add("heat-mid");
    else el.classList.add("heat-low");
  }
}

function toggleHeatmap() {
  heatmapEnabled = !heatmapEnabled;
  applyHeatmap();
  setText("Mistake heatmap " + (heatmapEnabled ? "enabled" : "disabled"));
}

function setText(html) {
  document.getElementById("explanation").innerHTML = html;
}
</script>

</body>
</html>

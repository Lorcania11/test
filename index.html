<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockfish Chess Analyzer with Chessboard.js</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stockfish@16/src/stockfish.js"></script>
  <script src="https://unpkg.com/chess.js@1.0.0-beta.6/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #board { width: 500px; margin: 20px auto; position: relative; }
    .square-light { background-color: #f0d9b5; }
    .square-dark { background-color: #b58863; }
    .arrows { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-5xl font-bold text-center mb-8 text-yellow-400">MasterChess Analyzer</h1>

    <div class="grid lg:grid-cols-2 gap-10 mb-8">
      <!-- Board -->
      <div class="flex flex-col items-center">
        <div id="board"></div>
        <div class="mt-4 text-center space-y-2">
          <div class="text-2xl font-bold">
            Eval: <span id="eval" class="text-green-400">0.0</span>
          </div>
          <div id="best-move" class="text-xl"></div>
          <button id="flip-btn" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">Flip Orientation</button>
        </div>
      </div>

      <!-- Controls -->
      <div class="space-y-6">
        <!-- FEN Input -->
        <div class="bg-gray-800 p-4 rounded-lg">
          <label class="block text-lg mb-2">Current FEN</label>
          <textarea id="fen-input" class="w-full bg-gray-900 p-2 rounded text-sm h-20 font-mono"></textarea>
          <button id="set-fen" class="mt-2 bg-green-600 px-4 py-2 rounded hover:bg-green-700 w-full">Reset Board</button>
        </div>

        <!-- Moves -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-lg mb-2">Your Move</label>
            <input id="user-move-input" type="text" placeholder="e.g. c6" class="w-full p-2 bg-gray-900 rounded text-sm">
          </div>
          <div>
            <label class="block text-lg mb-2">Best Move</label>
            <input id="best-move-input" type="text" readonly class="w-full p-2 bg-green-900 rounded text-sm">
          </div>
        </div>

        <button id="analyze-btn" class="w-full bg-blue-600 px-4 py-3 rounded hover:bg-blue-700 text-lg font-bold">Analyze</button>
        <button id="deep-analysis-btn" class="w-full bg-indigo-600 px-4 py-3 rounded hover:bg-indigo-700 text-lg font-bold">Deep Analysis</button>

        <!-- Analysis Section -->
        <div id="analysis-section" class="space-y-4 hidden">
          <div id="classification" class="p-4 rounded text-white font-bold"></div>
          <div id="explanation" class="bg-gray-800 p-4 rounded"></div>
          <div class="bg-gray-800 p-4 rounded">
            <h3 class="text-lg font-bold mb-2">Your Move Variations</h3>
            <select id="your-variation-select" class="w-full p-2 bg-gray-900 rounded mb-2"></select>
            <div class="flex gap-2">
              <button id="your-prev" class="bg-blue-600 px-4 py-2 rounded">Prev</button>
              <button id="your-next" class="bg-blue-600 px-4 py-2 rounded">Next</button>
            </div>
            <p id="your-var-eval" class="mt-2"></p>
          </div>
          <div class="bg-gray-800 p-4 rounded">
            <h3 class="text-lg font-bold mb-2">Best Move Variations</h3>
            <select id="best-variation-select" class="w-full p-2 bg-gray-900 rounded mb-2"></select>
            <div class="flex gap-2">
              <button id="best-prev" class="bg-blue-600 px-4 py-2 rounded">Prev</button>
              <button id="best-next" class="bg-blue-600 px-4 py-2 rounded">Next</button>
            </div>
            <p id="best-var-eval" class="mt-2"></p>
          </div>
        </div>

        <!-- Mistakes -->
        <div id="mistakes" class="bg-gray-800 p-4 rounded-lg mt-8">
          <h2 class="text-2xl font-bold mb-4">Session Mistakes</h2>
          <div id="mistakes-list" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="text-center text-yellow-400 text-xl"></div>
  </div>

  <script>
    let board = null;
    let game = new Chess();
    let stockfish = null;
    let orientation = 'white';
    let mode = 'analyze';
    let bestMoveUCI = '';
    let mistakes = JSON.parse(localStorage.getItem('chessMistakes') || '[]');
    let originalFen = '';
    let originalEval = 0;
    let yourVariations = [];
    let bestVariations = [];
    let currentVarType = '';
    let currentVarIndex = 0;
    let currentStep = 0;
    let lastPVs = [];
    let currentFen = '';
    let currentAnalysis = '';

    // Init Stockfish (local fallback)
    function initStockfish() {
      stockfish = new Worker('https://cdn.jsdelivr.net/npm/stockfish@16/src/stockfish.js');
      stockfish.postMessage('uci');
      stockfish.postMessage('setoption name MultiPV value 3');
      stockfish.postMessage('isready');
      stockfish.onmessage = function(event) {
        const msg = event.data;
        if (msg.startsWith('bestmove')) {
          $('#status').text('Local analysis complete.');
          if (currentAnalysis === 'original') {
            bestVariations = lastPVs;
            $('#best-move-input').val(lastPVs[0].pv[0] || '');
          } else if (currentAnalysis === 'user') {
            yourVariations = lastPVs;
          }
        } else if (msg.startsWith('info')) {
          const multipv = msg.match(/multipv (\d+)/)?.[1];
          const score = msg.match(/score cp (-?\d+)/)?.[1];
          const pvStr = msg.match(/pv (.*)/)?.[1];
          if (multipv && pvStr) {
            const pvUci = pvStr.split(' ');
            const tempGame = new Chess(currentFen);
            const pvSan = pvUci.map(uci => {
              const move = tempGame.move(uci);
              return move ? move.san : null;
            }).filter(s => s);
            lastPVs[parseInt(multipv) - 1] = {pv: pvSan, uci: pvUci, eval: (parseFloat(score) / 100).toFixed(2), text: 'Local analysis'};
          }
          if (score) {
            const eval = (parseFloat(score) / 100).toFixed(2);
            $('#eval').text(eval).removeClass('text-green-400 text-red-400').addClass(eval > 0 ? 'text-green-400' : 'text-red-400');
          }
        }
      };
    }

    // Cloud Analysis (chess-api.com)
    async function cloudAnalyze(fen, variants = 3, depth = 18) {
      try {
        const data = { fen, variants, depth };
        const res = await fetch('https://chess-api.com/v1', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        return json.lines.map((line, i) => ({
          pv: line.pv.split(' '), // UCI to SAN? Assume pv is SAN, adjust if needed
          uci: line.pv.split(' '), // Assume pv is UCI for arrows
          eval: line.eval,
          text: line.text || 'No explanation provided'
        }));
      } catch (e) {
        console.error('Cloud API error:', e);
        $('#status').text('Cloud API failed, using local.');
        return [];
      }
    }

    // Init Board
    function initBoard(fen = 'start') {
      const config = {
        draggable: true,
        position: fen,
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd,
        orientation: orientation,
        showNotation: true,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
      };
      board = Chessboard('board', config);
      addArrowsOverlay();
    }

    // Add SVG for arrows
    function addArrowsOverlay() {
      if ($('.arrows').length === 0) {
        $('#board').append(`
          <svg class="arrows" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;">
            <defs>
              <marker id="arrowhead" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="green" />
              </marker>
            </defs>
          </svg>
        `);
      }
    }

    // Draw Arrow
    function drawArrow(uci) {
      clearArrow();
      const squareSize = $('.square').first().outerWidth();
      const fromSq = $('.square-' + uci.slice(0,2));
      const toSq = $('.square-' + uci.slice(2,4));
      if (fromSq.length && toSq.length) {
        const fromPos = fromSq.position();
        const toPos = toSq.position();
        const x1 = fromPos.left + squareSize / 2;
        const y1 = fromPos.top + squareSize / 2;
        const x2 = toPos.left + squareSize / 2;
        const y2 = toPos.top + squareSize / 2;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', 'green');
        line.setAttribute('stroke-width', '5');
        line.setAttribute('marker-end', 'url(#arrowhead)');
        $('.arrows').append(line);
      }
    }

    // Clear Arrow
    function clearArrow() {
      $('.arrows').empty();
      addArrowsOverlay(); // Re-add defs
    }

    // Drag/Drop
    function onDragStart(source, piece) {
      if (game.game_over() || (game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
    }

    function onDrop(source, target) {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      $('#user-move-input').val(move.san);
      updateStatus();
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    // Set FEN
    $('#set-fen').click(function() {
      const fen = $('#fen-input').val();
      game.load(fen);
      originalFen = fen;
      initBoard(fen);
      $('#analysis-section').addClass('hidden');
      clearArrow();
    });

    // Analyze (local quick)
    $('#analyze-btn').click(function() {
      currentAnalysis = 'original';
      currentFen = originalFen;
      lastPVs = [];
      stockfish.postMessage('position fen ' + originalFen);
      stockfish.postMessage('go depth 20');
      $('#status').text('Analyzing...');
    });

    // Deep Analysis (cloud)
    $('#deep-analysis-btn').click(async function() {
      const userSan = $('#user-move-input').val().trim();
      if (!userSan) return alert('Enter your move');
      const tempGame = new Chess(originalFen);
      const userMove = tempGame.move(userSan);
      if (!userMove) return alert('Invalid move');

      $('#status').text('Deep cloud analysis...');
      originalEval = parseFloat(bestVariations[0]?.eval) || 0;

      // Analyze after user move for exploit lines
      const userFen = tempGame.fen();
      yourVariations = await cloudAnalyze(userFen);
      const userEvalAfter = yourVariations[0]?.eval || 0;
      const delta = originalEval - userEvalAfter;

      // Classify
      let classType = delta > 3 ? 'Blunder' : delta > 1 ? 'Mistake' : delta > 0.5 ? 'Inaccuracy' : 'Good';
      const colors = {Blunder: 'bg-red-600', Mistake: 'bg-orange-600', Inaccuracy: 'bg-yellow-600', Good: 'bg-green-600'};
      $('#classification').addClass(colors[classType]).html(`<h2 class="text-xl font-bold">${classType}</h2>`);

      // Step-by-step explanation for your move
      let yourExp = `<p>Your move ${userSan} is a ${classType.toLowerCase()} (delta ${delta.toFixed(2)}).</p><p>Opponent exploits:</p>`;
      yourVariations.forEach((v, i) => {
        yourExp += `<p>Variation ${i+1}: ${v.pv.join(' ')} (eval ${v.eval}) - ${v.text}</p>`;
      });
      yourExp += '<p>Play through to see material gain (stops if >5 eval or 10 steps).</p>';
      $('#explanation').html(yourExp);

      // Best variations
      bestVariations = await cloudAnalyze(originalFen);

      // Show and populate
      $('#analysis-section').removeClass('hidden');
      populateVariationSelects();
      currentVarType = 'your';
      currentVarIndex = 0;
      updateVariationBoard();
    });

    // Populate Selects
    function populateVariationSelects() {
      $('#your-variation-select').empty();
      yourVariations.forEach((v, i) => $('#your-variation-select').append(`<option value="${i}">Var ${i+1}: eval ${v.eval}</option>`));
      $('#best-variation-select').empty();
      bestVariations.forEach((v, i) => $('#best-variation-select').append(`<option value="${i}">Var ${i+1}: eval ${v.eval}</option>`));
    }

    // Variation Select Change
    $('#your-variation-select').change(function() {
      currentVarType = 'your';
      currentVarIndex = parseInt($(this).val());
      currentStep = 0;
      updateVariationBoard();
    });
    $('#best-variation-select').change(function() {
      currentVarType = 'best';
      currentVarIndex = parseInt($(this).val());
      currentStep = 0;
      updateVariationBoard();
    });

    // Prev/Next
    $('#your-prev, #best-prev').click(function() {
      if (currentStep > 0) currentStep--;
      updateVariationBoard();
    });
    $('#your-next, #best-next').click(function() {
      const vars = currentVarType === 'your' ? yourVariations : bestVariations;
      if (currentStep < vars[currentVarIndex].pv.length) currentStep++;
      updateVariationBoard();
    });

    // Update Var Board
    function updateVariationBoard() {
      const vars = currentVarType === 'your' ? yourVariations : bestVariations;
      const pv = vars[currentVarIndex].pv;
      const uci = vars[currentVarIndex].uci;
      const temp = new Chess(originalFen);
      for (let i = 0; i < currentStep; i++) {
        temp.move(pv[i]);
      }
      board.position(temp.fen());
      clearArrow();
      if (currentStep < pv.length) {
        drawArrow(uci[currentStep]);
      }
      const varEval = vars[currentVarIndex].eval;
      const pId = currentVarType + '-var-eval';
      $('#' + pId).text(`Step ${currentStep + 1}/${pv.length} | Eval: ${varEval} | Line: ${pv.join(' ')}`);
      // Stop if material edge or overkill
      if (Math.abs(varEval) > 5 || currentStep > 10) {
        $('#' + currentVarType + '-next').prop('disabled', true);
        $('#' + pId).append(' (Overkill or clear advantage)');
      } else {
        $('#' + currentVarType + '-next').prop('disabled', false);
      }
    }

    // Update Mistakes
    function updateMistakesList() {
      const list = $('#mistakes-list');
      list.empty();
      mistakes.slice(-5).reverse().forEach(m => list.append(`<div>You played ${m.user} | Best was ${m.best}</div>`));
      if (mistakes.length) $('#mistakes').removeClass('hidden');
    }

    // Update Status
    function updateStatus() {
      let status = game.turn() === 'w' ? 'White to move' : 'Black to move';
      if (game.in_checkmate()) status = 'Checkmate';
      else if (game.in_draw()) status = 'Draw';
      $('#status').text(status);
    }

    // Init
    $(document).ready(function() {
      initStockfish();
      initBoard('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
      updateMistakesList();
      updateStatus();
      $('#fen-input').val(game.fen());
      originalFen = game.fen();
    });
  </script>
</body>
</html>
